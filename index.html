<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MM10 — Digital Archive</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">

    <!-- Components -->
    <link rel="stylesheet" href="css/components/navbar.css">

    <!-- Sections -->
    <link rel="stylesheet" href="css/sections/hero.css">

</head>

<body>

    <!-- ==========================
         NAVIGATION
    =========================== -->

    <nav class="navbar">

        <div class="navbar-brand">
            MM10 / DIGITAL ARCHIVE
        </div>

        <div class="navbar-status">
            SCROLL TO EXPLORE — 001 / 026
        </div>

    </nav>


    <!-- ==========================
         HERO
    =========================== -->

    <main>

        <section class="hero">

            <div class="hero-content">

                <div class="hero-eyebrow">
                    MM10 — Digital Archive
                </div>

                <h1 class="hero-title">
                    <span>Mykhailo</span>
                    <span>Mudryk</span>
                </h1>


                <!-- IMAGE PLACEHOLDER -->

                <div class="hero-image">

                    <div class="hero-placeholder">
                        Player<br>
                        Image<br>
                        Placeholder
                    </div>

                </div>


                <!-- TECHNICAL INFORMATION -->

                <div class="hero-meta">

                    <div class="hero-meta-item">
                        <span class="hero-meta-label">
                            Archive
                        </span>

                        <span>
                            001
                        </span>
                    </div>

                    <div class="hero-meta-item">
                        <span class="hero-meta-label">
                            Position
                        </span>

                        <span>
                            LW / RW
                        </span>
                    </div>

                    <div class="hero-meta-item">
                        <span class="hero-meta-label">
                            Profile
                        </span>

                        <span>
                            MM10
                        </span>
                    </div>

                </div>


                <!-- SCROLL -->

                <div class="hero-scroll">

                    <span class="hero-scroll-line"></span>

                    <span>
                        Scroll to explore
                    </span>

                </div>

            </div>

        </section>

    </main>

<script src="js/animations/scroll.js"></script>
<script src="js/animations/hero.js"></script>   

</body>

</html>
